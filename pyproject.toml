[project]
name = "astro-show"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "waterchinap", email = "waterchinap@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "akshare>=1.19.1",
    "loguru>=0.7.3",
    "marimo>=0.25.2",
    "pandas>=3.0.6",
    "playwright>=1.64.0",
    "polars>=2.0.0",
    "pydantic>=2.14.1",
    "typer>=0.27.3",
]

[project.scripts]
astro-show = "astro_show:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

